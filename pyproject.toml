[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-darwin"
version = "0.1.0"
description = "A causal-adaptive AI kernel built from interventions, consequences, memory, and planning."
requires-python = ">=3.10"
authors = [{ name = "Project Darwin" }]
dependencies = []

[project.optional-dependencies]
# Acceleration for the mysterio embedding space and multi-process cognition.
# The core system runs without these: embeddings fall back to a dependency-free
# pure-Python backend, and supervision uses the stdlib multiprocessing module.
accel = ["torch>=2.0", "numpy>=1.24", "psutil>=5.9"]

[project.scripts]
darwin = "darwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

